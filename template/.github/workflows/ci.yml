name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        continue-on-error: true  # Remove once package-lock.json exists

      - run: npm install

      - run: npm run lint
        continue-on-error: true  # Remove once lint is configured

      - run: npm test
        continue-on-error: true  # Remove once tests exist

      - run: npm run build
        continue-on-error: true  # Remove once build is configured
