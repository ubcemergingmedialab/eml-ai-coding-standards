name: Bug
description: Something is broken
title: "[WEB] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: trello
    attributes:
      label: Trello card URL (if tracked)
      placeholder: https://trello.com/c/...

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Node 22, Chrome 125, Quest 3
    validations:
      required: true
