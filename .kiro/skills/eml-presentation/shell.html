<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <style>
    /* Theme tokens — default: EML. Override via themes.md */
    :root {
      --brand-navy: #002145;
      --brand-blue: #0055b7;
      --accent: #40b4e5;
      --paper: #f4f1ea;
      --ink: #0e1a28;
      --muted: #5b6b7c;
      --card: #ffffff;
      --ok: #1a7a4c;
      --caution: #b45309;
      --no: #b42318;
      --pill-yes-bg: #14532d;
      --pill-yes-fg: #bbf7d0;
      --pill-partial-bg: #78350f;
      --pill-partial-fg: #fde68a;
      --pill-no-bg: #7f1d1d;
      --pill-no-fg: #fecaca;
      --pill-caution-bg: #713f12;
      --pill-caution-fg: #fde68a;
      --dark-grad-a: #001a36;
      --dark-grad-b: #002145;
      --dark-grad-c: #00152c;
      --glow: rgba(64, 180, 229, 0.18);
      --font-ui: "Segoe UI", system-ui, sans-serif;
      --font-display: "Segoe UI", "Iowan Old Style", Georgia, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--brand-navy);
      color: var(--ink);
      font-family: var(--font-display);
    }

    #deck {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .slide {
      display: none;
      height: 100%;
      padding: 5.5vh 7vw 8vh;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(1200px 500px at 100% -10%, var(--glow), transparent 55%),
        linear-gradient(165deg, var(--dark-grad-a) 0%, var(--dark-grad-b) 45%, var(--dark-grad-c) 100%);
      color: var(--paper);
    }

    .slide.active { display: flex; }

    .slide.light {
      background: var(--paper);
      color: var(--ink);
    }

    .kicker {
      font-family: var(--font-ui);
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .slide.light .kicker { color: var(--brand-blue); }

    h1 {
      font-size: clamp(2.4rem, 5.4vw, 4.4rem);
      font-weight: 650;
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 16ch;
    }

    h2 {
      font-size: clamp(1.8rem, 3.6vw, 2.8rem);
      font-weight: 650;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    .lede {
      margin-top: 1.4rem;
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      max-width: 42ch;
      line-height: 1.45;
      color: color-mix(in srgb, var(--paper) 82%, transparent);
    }

    .slide.light .lede { color: var(--muted); }

    .meta {
      margin-top: 2.4rem;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      color: color-mix(in srgb, var(--paper) 55%, transparent);
    }

    ul.plain {
      list-style: none;
      display: grid;
      gap: 0.85rem;
      max-width: 52rem;
    }

    ul.plain li {
      font-size: clamp(1.05rem, 1.7vw, 1.35rem);
      line-height: 1.4;
      padding-left: 1.4rem;
      position: relative;
    }

    ul.plain li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      background: var(--accent);
    }

    .slide.light ul.plain li::before { background: var(--brand-blue); }

    .grid { display: grid; gap: 1rem; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 1.15rem 1.2rem 1.25rem;
    }

    .slide.light .card {
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--brand-navy) 10%, transparent);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--brand-navy) 6%, transparent);
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .card p, .card small {
      font-family: var(--font-ui);
      font-size: 0.92rem;
      line-height: 1.4;
      color: color-mix(in srgb, var(--paper) 75%, transparent);
    }

    .slide.light .card p,
    .slide.light .card small { color: var(--muted); }

    .num {
      font-family: var(--font-ui);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.35rem;
    }

    .slide.light .num { color: var(--brand-blue); }

    .pill {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      margin-bottom: 0.55rem;
    }

    .pill.yes { background: var(--pill-yes-bg); color: var(--pill-yes-fg); }
    .pill.partial { background: var(--pill-partial-bg); color: var(--pill-partial-fg); }
    .pill.no { background: var(--pill-no-bg); color: var(--pill-no-fg); }
    .pill.caution { background: var(--pill-caution-bg); color: var(--pill-caution-fg); }

    .phase {
      display: flex;
      align-items: stretch;
      gap: 0.7rem;
      margin-top: 0.4rem;
    }

    .phase .step {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 1.2rem 1.1rem;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .phase .arrow {
      align-self: center;
      color: var(--accent);
      font-size: 1.6rem;
      flex: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-ui);
      font-size: clamp(0.85rem, 1.3vw, 1.05rem);
    }

    th, td {
      text-align: left;
      padding: 0.7rem 0.65rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      vertical-align: top;
    }

    .slide.light th, .slide.light td {
      border-bottom: 1px solid color-mix(in srgb, var(--brand-navy) 10%, transparent);
    }

    th {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .slide.light th { color: var(--brand-blue); }

    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      font-family: var(--font-ui);
      font-size: 0.95rem;
    }

    .flow span.n {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      color: var(--paper);
    }

    /* Critical: light slides need dark chip text */
    .slide.light .flow span.n {
      background: color-mix(in srgb, var(--brand-blue) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--brand-blue) 28%, transparent);
      color: var(--brand-navy);
      font-weight: 600;
    }

    .flow i { color: var(--accent); font-style: normal; }
    .slide.light .flow i { color: var(--brand-blue); }

    .footer-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.4rem;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      color: color-mix(in srgb, var(--paper) 55%, transparent);
      background: linear-gradient(transparent, rgba(0,0,0,0.35));
      z-index: 10;
    }

    .progress {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: rgba(255,255,255,0.12);
    }

    .progress > i {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0%;
    }

    .help { opacity: 0.7; }

    code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.9em;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 0.05em 0.35em;
      border-radius: 4px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .grid.cols-2, .grid.cols-3, .grid.cols-5, .two-col, .phase {
        grid-template-columns: 1fr;
        flex-direction: column;
      }
      .phase .arrow { transform: rotate(90deg); }
    }

    @media print {
      html, body, #deck { height: auto; overflow: visible; background: #fff; }
      .slide { display: flex !important; page-break-after: always; min-height: 100vh; }
      .footer-bar { display: none; }
    }
  </style>
</head>
<body>
  <div id="deck">

    <!-- Replace slides below. First slide must include class "active". -->
    <section class="slide active">
      <p class="kicker">{{KICKER}}</p>
      <h1>{{TITLE}}</h1>
      <p class="lede">{{LEDE}}</p>
      <p class="meta">{{META}}</p>
    </section>

  </div>

  <div class="footer-bar">
    <span>{{FOOTER_LABEL}}</span>
    <span class="help">← → Space · F fullscreen</span>
    <span id="counter">1 / 1</span>
    <div class="progress"><i id="bar"></i></div>
  </div>

  <script>
    const slides = [...document.querySelectorAll(".slide")];
    const counter = document.getElementById("counter");
    const bar = document.getElementById("bar");
    let i = 0;

    function show(n) {
      i = (n + slides.length) % slides.length;
      slides.forEach((s, idx) => s.classList.toggle("active", idx === i));
      counter.textContent = (i + 1) + " / " + slides.length;
      bar.style.width = ((i + 1) / slides.length * 100) + "%";
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) {
        e.preventDefault(); show(i + 1);
      } else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) {
        e.preventDefault(); show(i - 1);
      } else if (e.key === "Home") { show(0); }
      else if (e.key === "End") { show(slides.length - 1); }
      else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      } else if (e.key === "p" || e.key === "P") {
        window.print();
      }
    });

    document.getElementById("deck").addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const x = e.clientX / window.innerWidth;
      show(x > 0.25 ? i + 1 : i - 1);
    });

    show(0);
  </script>
</body>
</html>
